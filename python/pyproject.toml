[project]
name = "meridian"
version = "0.1.0"
description = "Inference-time compute scheduler for reasoning models — Python facade and vLLM plugin."
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "angelnicolasc", email = "nick.dicerutti@gmail.com" }]
keywords = ["llm", "inference", "scheduler", "vllm", "reasoning"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "numpy>=2.0,<3.0",
    "pydantic>=2.9,<3.0",
    "prometheus-client>=0.21",
    "tomli>=2.0; python_version < '3.11'",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
]

[project.optional-dependencies]
vllm = [
    "vllm>=0.9.0",
]
torch = [
    "torch>=2.5",
]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.28",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.119",
    "ruff>=0.8.4",
    "mypy>=1.13",
    "maturin>=1.7",
]

[project.urls]
Homepage      = "https://github.com/angelnicolasc/meridian"
Repository    = "https://github.com/angelnicolasc/meridian"
Documentation = "https://angelnicolasc.github.io/meridian"
Issues        = "https://github.com/angelnicolasc/meridian/issues"

[build-system]
requires      = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meridian"]

# ---------------------------------------------------------------------------
# tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length    = 100
target-version = "py311"
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "N",             # pep8-naming
    "ANN",           # type annotations
    "D",             # pydocstyle
    "S",             # bandit-lite
    "C4",            # comprehensions
    "PTH",           # pathlib
]
ignore = [
    "D203",   # 1 blank line before class docstring — conflicts with D211
    "D213",   # multi-line docstring summary at second line — conflicts with D212
    "ANN401", # Any allowed at FFI boundary
    "S101",   # assert in tests is fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN", "S"]
"../benchmarks/**/*.py" = ["D", "S311", "ANN"]
"../benchmarks/tests/**/*.py" = ["D", "ANN", "S"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version       = "3.11"
strict               = true
warn_return_any      = true
warn_unused_ignores  = true
disallow_untyped_defs = true
files                = ["meridian"]

[[tool.mypy.overrides]]
module = [
    "vllm.*", "torch.*", "meridian._meridian", "datasets", "pyarrow", "pyarrow.*",
    "opentelemetry.exporter.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = ["-ra", "--strict-markers", "--strict-config"]
markers      = [
    "gpu: requires a CUDA-capable device (skipped by default in CI)",
    "vllm: requires vLLM and a tiny model checkpoint",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["meridian"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
