[book]
title    = "Meridian"
authors  = ["angelnicolasc"]
language = "en"
src      = "src"

[output.html]
git-repository-url    = "https://github.com/angelnicolasc/meridian"
git-repository-icon   = "fa-brands fa-github"
edit-url-template     = "https://github.com/angelnicolasc/meridian/edit/main/docs/{path}"
site-url              = "/meridian/"
default-theme         = "ayu"
preferred-dark-theme  = "ayu"
no-section-label      = true
mathjax-support       = true

[output.html.fold]
enable = true
level  = 1

[output.html.search]
enable               = true
limit-results        = 30
teaser-word-count    = 30
use-boolean-and      = true
boost-title          = 2
boost-hierarchy      = 2

[preprocessor.links]
[preprocessor.index]

[rust]
edition = "2024"
