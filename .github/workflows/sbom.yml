name: SBOM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cyclonedx:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: astral-sh/setup-uv@v3

      - name: install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Rust SBOM
        run: cargo cyclonedx --format json --output-pattern bom --override-filename sbom-rust

      - name: Python SBOM
        working-directory: python
        run: |
          uv sync --extra dev
          uv export --format requirements-txt --output-file requirements.lock
          uvx cyclonedx-py requirements requirements.lock -o ../sbom-python.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom-rust*.json
            sbom-python.cdx.json

      - name: attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom-rust*.json
            sbom-python.cdx.json
