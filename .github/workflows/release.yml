name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_mode:
        description: "Registry publish mode"
        type: choice
        default: dry-run
        options:
          - dry-run
          - live

permissions:
  contents:       write
  pull-requests:  write
  id-token:       write
  attestations:   write

jobs:
  release-plz:
    name: release-plz
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'angelnicolasc' && startsWith(github.ref, 'refs/heads/main')
    steps:
      - name: Check release token availability
        id: token
        env:
          TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RELEASE_PLZ_TOKEN is not configured — release-plz PR creation skipped. Add a PAT with repo + pull_request scopes as RELEASE_PLZ_TOKEN to enable."
          fi

      - uses: actions/checkout@v6
        if: steps.token.outputs.available == 'true'
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Install Rust 1.85.0
        if: steps.token.outputs.available == 'true'
        run: |
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          rustup default 1.85.0

      - uses: MarcoIeni/release-plz-action@v0.5
        if: steps.token.outputs.available == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ---------------------------------------------------------------------------
  # Tagged release: build artefacts, compute their digests, then call the
  # SLSA Level 2 generator workflow to attest provenance. Per ADR-0007 we
  # commit to L2 attestations on every tagged release.
  # ---------------------------------------------------------------------------

  build-artifacts:
    name: build-artifacts
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Rust 1.85.0
        run: |
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          rustup default 1.85.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install maturin
        run: pip install --upgrade maturin

      - name: Build Rust release artefacts
        run: |
          cargo build --workspace --release
          mkdir -p artifacts
          # Stage the static libs and metadata for downstream consumers.
          find target/release -maxdepth 1 -type f \
            \( -name '*.rlib' -o -name 'libmeridian*' -o -name 'meridian*' \) \
            -exec cp {} artifacts/ \;

      - name: Build Python wheel
        run: |
          maturin build --release \
            -m crates/meridian-python/Cargo.toml \
            -o artifacts/

      - name: Compute artefact digests
        id: hash
        run: |
          cd artifacts
          digests=$(sha256sum * | base64 -w0)
          echo "hashes=$digests" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: meridian-release-${{ github.ref_name }}
          path: artifacts/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Registry publish. Manual-only (workflow_dispatch). Defaults to dry-run:
  # it validates that the crates package and the wheel's metadata is correct
  # without pushing anything. Selecting `live` performs the real publish, and
  # only the steps whose tokens are present run — so the job is safe to invoke
  # before crates.io / PyPI credentials are configured.
  #
  # To enable live publishing, configure repo secrets `CARGO_REGISTRY_TOKEN`
  # (crates.io) and `PYPI_API_TOKEN` (PyPI), then run this workflow with
  # publish_mode = live. See ADR-0007.
  # ---------------------------------------------------------------------------
  publish:
    name: publish (${{ inputs.publish_mode }})
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch'
    # Job-level env so the token-presence checks are visible in step `if:`
    # conditions (step-level env is not).
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Rust 1.85.0
        run: |
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          rustup default 1.85.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install maturin and twine
        run: pip install --upgrade maturin twine

      # --- Dry-run validation (always) -------------------------------------
      - name: cargo publish dry-run (meridian-core)
        run: cargo publish --dry-run -p meridian-core
      - name: cargo package check (meridian-kernels)
        # --no-verify skips the build step, which would otherwise require
        # meridian-core to already be on crates.io.
        run: cargo publish --dry-run --no-verify -p meridian-kernels
      - name: Build wheel and validate metadata
        run: |
          maturin build --release -m crates/meridian-python/Cargo.toml -o dist/
          twine check dist/*.whl

      # --- Live publish (manual `live` mode, token-gated) ------------------
      - name: cargo publish (live)
        if: inputs.publish_mode == 'live' && env.CARGO_REGISTRY_TOKEN != ''
        run: |
          cargo publish -p meridian-core
          cargo publish -p meridian-kernels
      - name: PyPI publish (live)
        if: inputs.publish_mode == 'live' && env.PYPI_API_TOKEN != ''
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ env.PYPI_API_TOKEN }}
        run: twine upload dist/*.whl

  provenance:
    name: slsa-l2-provenance
    needs: build-artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions:      read
      id-token:     write
      contents:     write
    # Pinned by major to pick up patch-level security fixes without
    # silently absorbing breaking changes.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.build-artifacts.outputs.hashes }}
      upload-assets: true
