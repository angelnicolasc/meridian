name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages:    write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest

      - name: rustdoc
        run: |
          cargo doc --workspace --no-deps --all-features
          echo '<meta http-equiv="refresh" content="0; url=meridian_core/">' > target/doc/index.html

      - name: mdbook build
        run: mdbook build docs

      - name: assemble site
        run: |
          mkdir -p site
          cp -R docs/book/* site/
          mkdir -p site/api
          cp -R target/doc/* site/api/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
