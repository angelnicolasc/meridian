name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages:    write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.85.0
        run: |
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          rustup default 1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest

      - name: Install mdbook-mermaid
        # Pinned to 0.14.0: newer releases pull mdbook-core 0.5, which requires
        # rustc 1.88 — the workspace standardises on 1.85.
        run: cargo install mdbook-mermaid --version 0.14.0 --locked

      - name: Wire mermaid assets
        # Adds the `mermaid` preprocessor and copies mermaid.min.js +
        # mermaid-init.js into docs/. Idempotent; runs before the build so the
        # diagrams render in the published site.
        run: mdbook-mermaid install docs

      - name: rustdoc
        run: |
          cargo doc --workspace --no-deps --features prometheus,unstable,nixl,otel
          echo '<meta http-equiv="refresh" content="0; url=meridian_core/">' > target/doc/index.html

      - name: mdbook build
        run: mdbook build docs

      - name: assemble site
        run: |
          mkdir -p site
          cp -R docs/book/* site/
          mkdir -p site/api
          cp -R target/doc/* site/api/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
