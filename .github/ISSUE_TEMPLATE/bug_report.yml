name: Bug report
description: Report something that does not behave as documented.
title: "bug: <short summary>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Security issues must go through
        [SECURITY.md](https://github.com/angelnicolasc/meridian/blob/main/SECURITY.md) instead.

  - type: input
    id: version
    attributes:
      label: Meridian version
      placeholder: "e.g. 0.1.0 or git SHA"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - meridian-core (scheduler / phase router)
        - meridian-kernels (CUDA / FFI)
        - meridian-python / Python facade
        - vLLM plugin
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimum input — config, code, command — that reproduces the issue.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, GPU, CUDA version, Python/Rust versions, vLLM version (if relevant).
    validations:
      required: false
