name: Feature request
description: Propose a change or addition.
title: "feat: <short summary>"
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user-facing or operator-facing problem motivates this?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would change? Sketch the surface area, not the implementation.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: checkboxes
    id: governance
    attributes:
      label: Governance
      options:
        - label: This proposal warrants an ADR before implementation.
        - label: I am willing to implement this.
